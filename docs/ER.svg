<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" width="100%" height="100%" font-family="system-ui, Arial, sans-serif">
  <title>ER-схема Poker Monte Carlo: auth_user 1 — N web_task</title>
  <style>
    .box { fill: #ffffff; stroke: #334155; stroke-width: 1.5; }
    .head { fill: #1e3a8a; }
    .head-user { fill: #475569; }
    .htext { fill: #ffffff; font-size: 17px; font-weight: 600; }
    .sub { fill: #cbd5e1; font-size: 12px; }
    .f { fill: #0f172a; font-size: 14px; }
    .t { fill: #64748b; font-size: 13px; }
    .pk { fill: #b45309; font-weight: 700; font-size: 12px; }
    .fk { fill: #1d4ed8; font-weight: 700; font-size: 12px; }
    .note { fill: #475569; font-size: 13px; }
    .rel { stroke: #1d4ed8; stroke-width: 2; fill: none; }
    .card { fill: #1d4ed8; font-size: 15px; font-weight: 700; }
  </style>
  <rect width="920" height="520" fill="#f8fafc"/>
  <text x="30" y="38" font-size="20" font-weight="700" fill="#0f172a">ER-схема (после миграции 0003)</text>
  <text x="30" y="60" class="note">Одна таблица приложения — web_task; владелец — стандартный пользователь Django</text>

  <!-- auth_user -->
  <rect x="30" y="100" width="280" height="190" rx="8" class="box"/>
  <path d="M30 108 a8 8 0 0 1 8 -8 h264 a8 8 0 0 1 8 8 v46 h-280 z" class="head-user"/>
  <text x="46" y="125" class="htext">auth_user</text>
  <text x="46" y="139" class="sub">django.contrib.auth (стандартная)</text>
  <text x="46" y="176" class="pk">PK</text><text x="80" y="176" class="f">id</text><text x="210" y="176" class="t">bigint</text>
  <text x="80" y="198" class="f">username</text><text x="210" y="198" class="t">varchar(150)</text>
  <text x="80" y="224" class="f">password</text><text x="210" y="224" class="t">hash</text>
  <text x="80" y="250" class="f">is_staff, is_superuser</text>
  <text x="80" y="274" class="t">… прочие поля Django</text>

  <!-- web_task -->
  <rect x="540" y="100" width="350" height="330" rx="8" class="box"/>
  <path d="M540 108 a8 8 0 0 1 8 -8 h334 a8 8 0 0 1 8 8 v46 h-350 z" class="head"/>
  <text x="556" y="125" class="htext">web_task</text>
  <text x="556" y="139" class="sub">web.models.Task</text>
  <text x="556" y="176" class="pk">PK</text><text x="590" y="176" class="f">id</text><text x="740" y="176" class="t">bigint</text>
  <text x="556" y="198" class="fk">FK</text><text x="590" y="198" class="f">owner_id</text><text x="740" y="198" class="t">→ auth_user, null</text>
  <text x="590" y="224" class="f">name</text><text x="740" y="224" class="t">varchar(255)</text>
  <text x="590" y="250" class="f">params</text><text x="740" y="250" class="t">JSON (вход)</text>
  <text x="590" y="276" class="f">status</text><text x="740" y="276" class="t">varchar(32)</text>
  <text x="590" y="302" class="f">result</text><text x="740" y="302" class="t">JSON, null</text>
  <text x="590" y="328" class="f">error</text><text x="740" y="328" class="t">text, null</text>
  <text x="590" y="354" class="f">created_at</text><text x="740" y="354" class="t">datetime</text>
  <text x="590" y="380" class="f">updated_at</text><text x="740" y="380" class="t">datetime</text>
  <text x="556" y="414" class="note">status: PENDING · RUNNING · FINISHED · FAILED</text>

  <!-- связь 1 : N -->
  <path d="M310 190 H 425 V 198 H 540" class="rel"/>
  <text x="318" y="182" class="card">1</text>
  <text x="520" y="190" class="card">N</text>
  <text x="340" y="222" class="note">владеет задачами</text>
  <text x="340" y="240" class="note">ON DELETE CASCADE</text>

  <text x="30" y="470" class="note">Результат — метаданные расчёта в result (JSON, несколько чисел); больших массивов нет, файлы в MEDIA_ROOT не нужны.</text>
  <text x="30" y="492" class="note">Удалены как неиспользуемые (миграция 0003): PokerHand, HandPlayer, Card, HandAction, Strategy.</text>
</svg>
