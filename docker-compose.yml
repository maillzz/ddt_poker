# Заезд 2 (занятие 16). Всё приложение одной командой: docker compose up --build
# Для заезда 1 можно поднимать только redis: docker compose up redis
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: calc
      POSTGRES_PASSWORD: calc
      POSTGRES_DB: calc
    volumes: ["pgdata:/var/lib/postgresql/data"]
    ports: ["5432:5432"]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  web:
    build: .
    command: sh -c "python manage.py migrate && gunicorn config.wsgi:application --bind 0.0.0.0:8000"
    environment:
      DATABASE_URL: postgres://calc:calc@db:5432/calc
      REDIS_URL: redis://redis:6379/0
      USE_QUEUE: "1"
      # Без ключа compose не стартует (никакого ключа по умолчанию). Берётся из .env рядом с файлом.
      SECRET_KEY: ${SECRET_KEY:?задайте SECRET_KEY в .env (см. .env.example)}
      # Конкретные хосты вместо "*": иначе принимается любой заголовок Host.
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
    ports: ["8000:8000"]
    volumes: ["media:/app/media"]
    depends_on: [db, redis]
  worker:
    build: .
    command: python manage.py rqworker
    environment:
      DATABASE_URL: postgres://calc:calc@db:5432/calc
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:?задайте SECRET_KEY в .env (см. .env.example)}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
    volumes: ["media:/app/media"]
    depends_on: [db, redis]
volumes:
  pgdata:
  media:
