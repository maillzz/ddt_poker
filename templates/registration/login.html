{% extends "base.html" %}
{% block h1 %}Вход{% endblock %}
{% block content %}
{% if form.errors %}<p class="card">Неверное имя пользователя или пароль.</p>{% endif %}
<form method="post">{% csrf_token %}
  {{ form.as_p }}
  <input type="hidden" name="next" value="{{ next }}">
  <button type="submit">Войти</button>
</form>
<p>Аккаунт создаёт администратор: <code>python manage.py createsuperuser</code> или через <a href="/admin/">админку</a>.</p>
{% endblock %}
